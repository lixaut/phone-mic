<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：内容延伸到刘海区，配合 CSS safe-area-inset 适配 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Phone Mic</title>

  <!--
    样式模块（按层引用，后者可覆盖前者）：
    - theme.css      全局主题：重置、根布局、黑白灰基调
    - layout.css     三段式布局：顶栏 / 波形区 / 按钮区、安全区适配
    - components.css 可交互组件：常亮开关、INPUT/OUTPUT 大圆钮
  -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- 顶部状态栏：左=连接状态（圆点+文字），右=屏幕常亮开关 -->
  <div class="topbar">
    <div class="conn" id="conn">
      <span class="dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
    <span class="awake-toggle" id="awakeBtn">常亮</span>
  </div>

  <!-- 中部波形区：实时音频波形（静音时为一排横线段） -->
  <div class="wave-area" id="waveArea">
    <div class="pull-indicator" id="pullIndicator">
      <svg viewBox="0 0 24 24" class="pull-icon"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      <span class="pull-text">下拉刷新</span>
    </div>
    <canvas id="wave"></canvas>
  </div>

  <!-- 底部控制区：INPUT=手机麦克风推流，OUTPUT=电脑声音播放 -->
  <div class="btn-row">
    <button class="ctrl-btn btn-in" id="micBtn">
      <div class="bg"></div>
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
      <span class="label">INPUT</span>
    </button>
    <button class="ctrl-btn btn-out" id="outBtn">
      <div class="bg"></div>
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
      <span class="label">OUTPUT</span>
    </button>
  </div>

  <!-- 调试日志：默认隐藏，连点顶部连接状态 5 次切换 -->
  <pre id="dbglog"></pre>

  <!--
    脚本模块（顺序敏感，均为 IIFE 挂载到 window.PhoneMic 命名空间）：
    - wakelock.js  屏幕常亮开关（默认开启）
    - connection.js WebSocket 连接与自动重连
    - audio.js      麦克风采集 + 扬声器播放（ScriptProcessor）
    - waveform.js   波形可视化（页面加载即显示静音波形）
    - main.js       主入口：初始化各模块、绑定按钮、启动连接（必须最后）
  -->
  <script src="js/wakelock.js"></script>
  <script src="js/connection.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/waveform.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
